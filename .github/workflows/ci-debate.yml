name: CI Debate Intake

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-and-report:
    runs-on:
      - self-hosted
      - Windows
    timeout-minutes: 30
    env:
      CI: true
      ORCHESTRATOR_URL: ${{ secrets.ORCHESTRATOR_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        shell: pwsh
        run: corepack pnpm install --frozen-lockfile

      - name: Run lint
        id: lint
        continue-on-error: true
        shell: pwsh
        run: |
          corepack pnpm lint *>&1 | Tee-Object -FilePath lint.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests
        id: test
        continue-on-error: true
        shell: pwsh
        run: |
          corepack pnpm test *>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run typecheck
        id: typecheck
        continue-on-error: true
        shell: pwsh
        run: |
          corepack pnpm typecheck *>&1 | Tee-Object -FilePath typecheck.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run build
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          corepack pnpm build *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report failure to orchestrator
        if: >
          always() &&
          env.ORCHESTRATOR_URL != '' &&
          (
            steps.lint.outcome == 'failure' ||
            steps.test.outcome == 'failure' ||
            steps.typecheck.outcome == 'failure' ||
            steps.build.outcome == 'failure'
          )
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          PR_URL: ${{ github.event.pull_request.html_url || '' }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          $failureType = 'build_failure'
          if ($env:LINT_OUTCOME -eq 'failure') {
            $failureType = 'lint_error'
          } elseif ($env:TEST_OUTCOME -eq 'failure') {
            $failureType = 'test_failure'
          }

          $lines = @(
            'GitHub workflow: CI Debate Intake',
            "Repository: $env:REPOSITORY",
            "Branch: $env:BRANCH_NAME",
            "Commit: $env:COMMIT_SHA",
            ("Pull Request: " + ($(if ($env:PR_URL) { $env:PR_URL } else { 'none' }))),
            '',
            'Step outcomes:',
            "- lint: $env:LINT_OUTCOME",
            "- test: $env:TEST_OUTCOME",
            "- typecheck: $env:TYPECHECK_OUTCOME",
            "- build: $env:BUILD_OUTCOME"
          )

          foreach ($file in @('lint.log', 'test.log', 'typecheck.log', 'build.log')) {
            if (Test-Path $file) {
              $lines += ''
              $lines += "===== $file ====="
              $lines += Get-Content $file
            }
          }

          $payload = @{
            eventId = ([guid]::NewGuid()).ToString()
            repository = $env:REPOSITORY
            commitSha = $env:COMMIT_SHA
            branch = $env:BRANCH_NAME
            failureType = $failureType
            errorLog = ($lines -join "`n")
            timestamp = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json -Depth 5

          Invoke-RestMethod `
            -Method Post `
            -Uri "$($env:ORCHESTRATOR_URL.TrimEnd('/'))/api/events" `
            -ContentType 'application/json' `
            -Body $payload

      - name: Fail workflow if any validation failed
        if: >
          steps.lint.outcome == 'failure' ||
          steps.test.outcome == 'failure' ||
          steps.typecheck.outcome == 'failure' ||
          steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host 'One or more validation steps failed.'
          exit 1
